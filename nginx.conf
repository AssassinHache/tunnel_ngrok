events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    map $http_x_forwarded_proto $forwarded_proto {
        default $http_x_forwarded_proto;
        ''      $scheme;
    }

    server {
        listen 8080;
        server_name _;

        client_max_body_size 50M;
        root /usr/share/nginx/html;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;
        add_header Content-Security-Policy "frame-ancestors 'none'; object-src 'none'; base-uri 'self'" always;

        location ^~ /storage/progress_photos/ { return 404; }
        location ~ /\. { deny all; }


        # 1. Backend Laravel - Endpoints de la API
        location /api/ {
            proxy_pass http://host.docker.internal:8000/api/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port 443;
            proxy_set_header ngrok-skip-browser-warning "true";
        }

        # 2. Backend Laravel - Archivos estáticos y subidas
        location /storage/ {
            proxy_pass http://host.docker.internal:8000/storage/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port 443;
            proxy_set_header ngrok-skip-browser-warning "true";
        }

        # 3. Backend Python (FastAPI) - WebSockets de Visión Artificial
        location /corregir_pose/ {
            access_log off;
            proxy_pass http://host.docker.internal:5000/corregir_pose/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        location /ws/ { return 404; }

        # 4. Backend Python (FastAPI) - Sesiones y Reportes PDF
        location /session/ { return 404; }

        # 5. Backend LLM (Flask Chef Nutricional - Puerto 5002)
        location /chat { return 404; }

        # Compiled frontend; never publish Vite source or its development server.
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
